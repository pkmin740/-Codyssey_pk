<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D.D — 개인 작업 공간</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#202938;--muted:#7b8492;--line:#e8ebf0;--blue:#3978e8;--blue-soft:#edf4ff;--green:#239b68;--green-soft:#eaf8f1;--red:#d94b4b;--shadow:0 5px 22px #27364b0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:9px 12px;background:#f1f3f6;color:var(--ink);transition:.15s}button:hover{filter:brightness(.97)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--blue);color:white}.danger{background:#fff0f0;color:var(--red)}.ghost{background:transparent}.small{font-size:12px;padding:6px 9px}.muted{color:var(--muted)}.app{max-width:1440px;margin:auto;padding:20px 24px 40px}.top{height:52px;display:flex;align-items:center;margin-bottom:16px}.logo{width:42px;height:42px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px;align-items:start}.main{min-width:0}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.writing{padding:20px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.section-head h1{font-size:18px;margin:0}.search{width:min(330px,55%);border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fafbfc;outline:none}.search:focus,input:focus,textarea:focus,select:focus{border-color:#9bbcf8;outline:2px solid #3978e81a}.editor-grid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;min-height:600px}.entries{border-right:1px solid var(--line);padding-right:14px;min-width:0}.entry-top{display:flex;justify-content:space-between;align-items:center;margin:2px 0 12px}.entry-top strong{font-size:13px}.group-title{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:12px;color:#586273;padding:9px 5px 5px}.group-title button{padding:3px 5px;font-size:11px}.entry{padding:10px;border-radius:10px;cursor:pointer;margin:3px 0;border:1px solid transparent}.entry:hover{background:#f7f9fc}.entry.active{background:var(--blue-soft);border-color:#d9e7ff}.entry b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.entry small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.subgroup{padding-left:12px}.empty-list{padding:24px 8px;text-align:center;color:var(--muted);font-size:12px}.article{min-width:0}.article-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.article-head .actions{display:flex;gap:6px}.title-input{width:100%;border:0;border-bottom:1px solid var(--line);padding:10px 2px 14px;font-size:22px;font-weight:700;outline:none;background:transparent}.meta-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0;color:var(--muted);font-size:12px}.meta-row select{border:1px solid var(--line);border-radius:8px;padding:6px;background:white;color:var(--ink);max-width:100%}.toolbar{display:flex;gap:5px;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:12px 0}.toolbar button{padding:6px 9px;font-size:12px}.toolbar select{border:1px solid var(--line);border-radius:7px;padding:5px;font-size:12px}.body-editor{min-height:330px;outline:none;line-height:1.8;font-size:15px;overflow-wrap:anywhere;padding:8px 2px}.body-editor:empty:before{content:"오늘의 생각을 자유롭게 적어 보세요.";color:#aab1bc}.body-editor h2,.body-editor h3{line-height:1.4}.body-editor ul{padding-left:22px}.article-date{font-size:12px;color:var(--muted);margin-top:14px}.notes{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}.notes h3{font-size:13px;margin:0 0 10px}.note-form{display:flex;gap:8px}.note-form input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px}.note{padding:10px;background:#f8f9fb;border-radius:9px;margin-top:8px}.note-text{white-space:pre-wrap;overflow-wrap:anywhere}.note small{color:var(--muted);font-size:11px}.note-actions{float:right;display:flex;gap:4px}.note-actions button{padding:3px 6px;font-size:11px}.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:16px}.widget{padding:18px}.widget h2{font-size:15px;margin:0}.timer-mode{font-size:12px;color:var(--blue);font-weight:700;text-align:center;margin-top:20px}.timer-mode.rest{color:var(--green)}.timer{font-size:48px;letter-spacing:-2px;font-weight:750;text-align:center;margin:5px 0 16px;font-variant-numeric:tabular-nums}.timer.rest{color:var(--green)}.timer-actions{display:flex;justify-content:center;gap:8px}.timer-actions button{min-width:86px}.timer-hint{text-align:center;color:var(--muted);font-size:11px;margin-top:12px}.todo-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.date-nav{display:flex;align-items:center;gap:5px;margin:15px 0}.date-nav input{min-width:0;flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 5px}.todo-add{display:flex;gap:6px}.todo-add input{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px}.todo-list{list-style:none;padding:0;margin:12px 0 0}.todo-item{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px solid #f0f1f4}.todo-item input{margin-top:3px;accent-color:var(--blue)}.todo-item span{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.5}.todo-item.done span{text-decoration:line-through;color:#9aa2ad}.todo-item button{padding:3px 5px;font-size:11px}.todo-empty{font-size:12px;color:var(--muted);text-align:center;padding:15px 0}.bottom-tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.bottom-tools button{font-size:12px}.hidden{display:none!important}.modal-backdrop{position:fixed;inset:0;background:#18233366;display:grid;place-items:center;padding:18px;z-index:10}.modal{background:white;border-radius:15px;padding:20px;width:min(430px,100%);box-shadow:0 15px 50px #0002}.modal h3{margin:0 0 12px}.modal p{color:#687282;line-height:1.6}.modal input,.modal select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin:6px 0 12px}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:16px}.category-tools{display:flex;gap:5px}.category-tools button{padding:3px 6px;font-size:10px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#263244;color:white;padding:10px 15px;border-radius:9px;z-index:20;box-shadow:var(--shadow);font-size:12px}
@media(max-width:850px){.layout{grid-template-columns:minmax(0,1fr)}.side{position:static;display:grid;grid-template-columns:1fr 1fr}.editor-grid{grid-template-columns:200px minmax(0,1fr)}}
@media(max-width:560px){.app{padding:12px 10px 28px}.writing{padding:13px}.side{grid-template-columns:1fr}.editor-grid{grid-template-columns:1fr;min-height:0}.entries{border-right:0;border-bottom:1px solid var(--line);padding:0 0 12px;max-height:260px;overflow:auto}.article-head{align-items:flex-start}.title-input{font-size:19px}.timer{font-size:43px}.section-head{align-items:flex-start;flex-direction:column}.search{width:100%}.note-form{flex-direction:column}.note-form button{align-self:flex-end}.article-head .actions{flex-wrap:wrap;justify-content:flex-end}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<svg class="logo" viewBox="0 0 100 100" aria-label="D.D 로고">
<path d="M18 8H50C75 8 92 25 92 50S75 92 50 92H18C12 92 8 88 8 82V18C8 12 12 8 18 8Z" fill="#3978e8"/>
<path d="M27 24C17 14 12 23 17 40C20 50 27 53 34 47L38 34Z" fill="#fff"/><path d="M61 34C72 15 85 23 81 42C78 53 69 55 61 47Z" fill="#fff"/>
<path d="M28 29C22 24 20 30 24 40C26 45 30 45 33 41Z" fill="#3978e8"/><path d="M66 39C73 25 79 30 75 42C73 47 68 46 65 43Z" fill="#3978e8"/>
<ellipse cx="39" cy="53" rx="4" ry="6" fill="#202938"/><ellipse cx="65" cy="53" rx="4" ry="6" fill="#202938"/>
<path d="M46 65Q52 59 58 65Q57 72 52 72Q47 72 46 65Z" fill="#202938"/><path d="M52 71V76M52 76Q47 81 43 77M52 76Q57 81 61 77" fill="none" stroke="#202938" stroke-width="2.5" stroke-linecap="round"/>
</svg>
</header>
<div class="layout">
<main class="main">
<section class="card writing">
<div class="section-head"><h1>글쓰기</h1><input id="search" class="search" placeholder="글·메모·카테고리 검색"></div>
<div class="editor-grid">
<aside class="entries">
<div class="entry-top"><strong>내 글</strong><button class="primary small" id="newPost">+ 새 글</button></div>
<div id="entryList"></div>
<div class="bottom-tools"><button id="addCategory">+ 카테고리</button></div>
</aside>
<section class="article">
<div class="article-head"><span class="muted" id="articleStatus">새 글을 작성해 보세요</span><div class="actions"><button class="danger small" id="deletePost" disabled>삭제</button></div></div>
<input id="postTitle" class="title-input" placeholder="제목을 입력하세요" maxlength="120">
<div class="meta-row"><span id="postDate">작성 날짜는 자동으로 기록됩니다</span><select id="postCategory" aria-label="카테고리"><option value="">미분류</option></select></div>
<div class="toolbar" aria-label="본문 서식">
<button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="formatBlock" data-value="H2">제목</button><button data-cmd="insertUnorderedList">• 목록</button>
<select id="fontSize" aria-label="글자 크기"><option value="">글자 크기</option></select>
</div>
<div id="postBody" class="body-editor" contenteditable="true" spellcheck="false"></div>
<div class="article-date" id="updatedAt"></div>
<div class="notes"><h3>메모</h3><form class="note-form" id="noteForm"><input id="noteInput" placeholder="나만 볼 수 있는 메모를 덧붙이세요"><button class="primary">메모 추가</button></form><div id="noteList"></div></div>
</section>
</div>
</section>
<div class="bottom-tools" style="justify-content:flex-end"><button id="exportBtn">내보내기 JSON</button><button id="importBtn">불러오기 JSON</button><input type="file" id="importFile" accept=".json,application/json" class="hidden"></div>
</main>
<aside class="side">
<section class="card widget">
<div class="section-head"><h2>뽀모도로</h2><span class="muted" style="font-size:11px">25분 집중 · 5분 휴식</span></div>
<div id="timerMode" class="timer-mode">집중 시간</div><div id="timer" class="timer">25:00</div>
<div class="timer-actions"><button class="primary" id="timerStart">시작</button><button id="timerReset">초기화</button></div>
<div class="timer-hint" id="timerHint">시작 버튼을 눌러 집중을 시작하세요.</div>
</section>
<section class="card widget">
<div class="todo-head"><h2>투두리스트</h2><span class="muted" id="todoCount" style="font-size:11px"></span></div>
<div class="date-nav"><button class="small" id="prevDay">‹</button><input type="date" id="todoDate"><button class="small" id="nextDay">›</button><button class="small" id="todayBtn">오늘</button></div>
<form class="todo-add" id="todoForm"><input id="todoInput" placeholder="할 일을 입력하세요"><button class="primary">추가</button></form>
<ul class="todo-list" id="todoList"></ul>
</section>
</aside>
</div>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), today=()=>new Date().toISOString().slice(0,10), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const KEY='dd_workspace_v1';
let data={posts:[],categories:[],todos:{},timer:{mode:'focus',remaining:1500,running:false,endAt:null}};
let currentId=null, todoDay=today(), tick=null;
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&typeof d==='object')data={...data,...d};}catch(e){} if(!Array.isArray(data.posts))data.posts=[];if(!Array.isArray(data.categories))data.categories=[];if(!data.todos)data.todos={};if(!data.timer)data.timer={mode:'focus',remaining:1500,running:false};}
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(s){$('toastRoot').innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>$('toastRoot').innerHTML='',2200);}
function categoryName(id){return data.categories.find(c=>c.id===id)?.name||'';}
function postSort(a,b){return b.createdAt.localeCompare(a.createdAt);}
function filteredPosts(){const q=$('search').value.trim().toLowerCase();return data.posts.filter(p=>{if(!q)return true;const cat=categoryName(p.categoryId),parent=data.categories.find(c=>c.id===p.categoryId)?.parentId, parentName=categoryName(parent);return [p.title,p.body,...(p.notes||[]).map(n=>n.text),cat,parentName].join(' ').toLowerCase().includes(q);}).sort(postSort);}
function renderEntries(){
 const root=$('entryList'), posts=filteredPosts(), cats=data.categories;
 const groups=[];
 const addGroup=(id,label,depth=0)=>{const arr=posts.filter(p=>p.categoryId===id);groups.push({id,label,depth,arr});};
 cats.filter(c=>!c.parentId).forEach(c=>{addGroup(c.id,c.name);cats.filter(x=>x.parentId===c.id).forEach(x=>addGroup(x.id,x.name,1));});
 addGroup('', '미분류');
 root.innerHTML='';
 groups.forEach(g=>{const wrap=document.createElement('div');const head=document.createElement('div');head.className='group-title'+(g.depth?' subgroup':'');head.innerHTML='<span>'+esc(g.label)+'</span><span class="category-tools"></span>';if(g.id){const tools=head.querySelector('.category-tools');tools.innerHTML='<button data-act="rename">수정</button><button data-act="delete" class="danger">삭제</button>';tools.querySelector('[data-act=rename]').onclick=()=>renameCategory(g.id);tools.querySelector('[data-act=delete]').onclick=()=>deleteCategory(g.id);}wrap.append(head);
 g.arr.forEach(p=>{const el=document.createElement('div');el.className='entry'+(p.id===currentId?' active':'');el.innerHTML='<b>'+esc(p.title||'제목 없음')+'</b><small>'+esc(p.createdAt.slice(0,10))+'</small>';el.onclick=()=>selectPost(p.id);wrap.append(el);});
 if(!g.arr.length&&g.id===''){} root.append(wrap);});
 if(!posts.length)root.insertAdjacentHTML('beforeend','<div class="empty-list">아직 글이 없습니다.</div>');
}
function renderCategorySelect(){const sel=$('postCategory'),val=sel.value||'';sel.innerHTML='<option value="">미분류</option>';data.categories.filter(c=>!c.parentId).forEach(c=>{sel.insertAdjacentHTML('beforeend',`<option value="${esc(c.id)}">${esc(c.name)}</option>`);data.categories.filter(x=>x.parentId===c.id).forEach(x=>sel.insertAdjacentHTML('beforeend',`<option value="${esc(x.id)}">　└ ${esc(x.name)}</option>`));});if([...sel.options].some(o=>o.value===val))sel.value=val;}
function selectPost(id){currentId=id;const p=data.posts.find(x=>x.id===id);if(!p)return; $('postTitle').value=p.title;$('postBody').innerHTML=p.body||'';$('postDate').textContent='작성일 '+p.createdAt.slice(0,10);$('updatedAt').textContent='';$('articleStatus').textContent='자동 저장 중';renderCategorySelect();$('postCategory').value=p.categoryId||'';$('deletePost').disabled=false;renderNotes();renderEntries();}
function newPost(){const p={id:uid(),title:'',body:'',createdAt:new Date().toISOString(),categoryId:'',notes:[]};data.posts.push(p);save();selectPost(p.id);$('postTitle').focus();}
function currentPost(){return data.posts.find(p=>p.id===currentId);}
function saveCurrent(){const p=currentPost();if(!p)return;p.title=$('postTitle').value;p.body=$('postBody').innerHTML;p.categoryId=$('postCategory').value;p.updatedAt=new Date().toISOString();save();renderEntries();}
function renderNotes(){const p=currentPost();$('noteList').innerHTML='';if(!p)return;(p.notes||[]).forEach(n=>{const el=document.createElement('div');el.className='note';el.innerHTML=`<div class="note-actions"><button data-edit>수정</button><button class="danger" data-del>삭제</button></div><div class="note-text">${esc(n.text)}</div><small>${new Date(n.createdAt).toLocaleString('ko-KR')}${n.edited?' · (수정됨)':''}</small>`;el.querySelector('[data-edit]').onclick=()=>{const v=prompt('메모를 수정하세요.',n.text);if(v===null)return;n.text=v;n.edited=true;save();renderNotes();};el.querySelector('[data-del]').onclick=()=>{if(confirm('이 메모를 삭제할까요?')){p.notes=p.notes.filter(x=>x.id!==n.id);save();renderNotes();}};$('noteList').append(el);});}
function deletePost(){const p=currentPost();if(!p||!confirm('이 글을 영구 삭제할까요? 삭제한 글은 복구할 수 없습니다.'))return;data.posts=data.posts.filter(x=>x.id!==p.id);currentId=null;save();$('postTitle').value='';$('postBody').innerHTML='';$('postDate').textContent='작성 날짜는 자동으로 기록됩니다';$('deletePost').disabled=true;$('articleStatus').textContent='새 글을 작성해 보세요';$('noteList').innerHTML='';renderEntries();}
function addCategory(){const name=prompt('새 카테고리 이름');if(!name?.trim())return;const parents=data.categories.filter(c=>!c.parentId);let parentId='';if(parents.length){const choice=prompt('소분류로 만들려면 큰 카테고리 이름을 정확히 입력하세요. 큰 카테고리로 만들려면 비워 두세요.');if(choice){const parent=parents.find(c=>c.name===choice.trim());if(!parent){alert('일치하는 큰 카테고리가 없습니다.');return;}parentId=parent.id;}}data.categories.push({id:uid(),name:name.trim(),parentId});save();renderCategorySelect();renderEntries();}
function renameCategory(id){const c=data.categories.find(x=>x.id===id);const v=prompt('카테고리 이름을 수정하세요.',c.name);if(!v?.trim())return;c.name=v.trim();save();renderCategorySelect();renderEntries();}
function deleteCategory(id){const c=data.categories.find(x=>x.id===id);const children=data.categories.filter(x=>x.parentId===id);if(!confirm(children.length?'큰 카테고리와 소분류를 삭제할까요? 해당 글은 미분류로 이동합니다.':'카테고리를 삭제할까요? 해당 글은 미분류로 이동합니다.'))return;const ids=[id,...children.map(x=>x.id)];data.posts.forEach(p=>{if(ids.includes(p.categoryId))p.categoryId='';});data.categories=data.categories.filter(x=>!ids.includes(x.id));save();renderCategorySelect();renderEntries();if(currentPost())$('postCategory').value=currentPost().categoryId||'';}
function command(cmd,val){$('postBody').focus();document.execCommand(cmd,false,val);saveCurrent();}
function renderTodos(){const list=$('todoList'),items=data.todos[todoDay]||[];list.innerHTML='';$('todoCount').textContent=items.filter(x=>x.done).length+'/'+items.length+' 완료';if(!items.length)list.innerHTML='<li class="todo-empty">등록된 할 일이 없습니다.</li>';items.forEach(item=>{const li=document.createElement('li');li.className='todo-item'+(item.done?' done':'');li.innerHTML=`<input type="checkbox" ${item.done?'checked':''}><span>${esc(item.text)}</span><button class="small" data-move>날짜 이동</button><button class="danger small" data-del>삭제</button>`;li.querySelector('input').onchange=e=>{item.done=e.target.checked;save();renderTodos();};li.querySelector('[data-del]').onclick=()=>{data.todos[todoDay]=items.filter(x=>x.id!==item.id);save();renderTodos();};li.querySelector('[data-move]').onclick=()=>{const v=prompt('옮길 날짜를 YYYY-MM-DD 형식으로 입력하세요.',todoDay);if(!v)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){alert('날짜 형식을 확인하세요.');return;}data.todos[v]??=[];data.todos[v].push(item);data.todos[todoDay]=items.filter(x=>x.id!==item.id);save();renderTodos();};list.append(li);});}
function changeDay(n){const d=new Date(todoDay+'T12:00:00');d.setDate(d.getDate()+n);todoDay=d.toISOString().slice(0,10);$('todoDate').value=todoDay;renderTodos();}
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=740;g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.65);o.start();o.stop(c.currentTime+.65);setTimeout(()=>c.close(),800);}catch(e){}}
function renderTimer(){const t=data.timer;if(t.running&&t.endAt){t.remaining=Math.max(0,Math.ceil((t.endAt-Date.now())/1000));if(t.remaining===0){if(t.mode==='focus'){t.mode='rest';t.remaining=300;t.running=true;t.endAt=Date.now()+300000;$('timerHint').textContent='집중 완료! 5분 휴식을 시작합니다.';}else{t.mode='focus';t.remaining=1500;t.running=false;t.endAt=null;$('timerHint').textContent='휴식 완료! 시작 버튼을 눌러 다음 집중을 시작하세요.';}beep();save();}}
$('timer').textContent=fmt(t.remaining);$('timer').classList.toggle('rest',t.mode==='rest');$('timerMode').textContent=t.mode==='rest'?'휴식 시간':'집중 시간';$('timerMode').classList.toggle('rest',t.mode==='rest');$('timerStart').textContent=t.running?'일시정지':(t.remaining<(t.mode==='focus'?1500:300)?'계속':'시작');}
function timerToggle(){const t=data.timer;if(t.running){t.remaining=Math.max(0,Math.ceil((t.endAt-Date.now())/1000));t.running=false;t.endAt=null;$('timerHint').textContent='일시정지했습니다.';}else{t.running=true;t.endAt=Date.now()+t.remaining*1000;$('timerHint').textContent='진행 중입니다. 응원합니다!';}save();renderTimer();}
function timerReset(){data.timer={mode:'focus',remaining:1500,running:false,endAt:null};save();$('timerHint').textContent='25분 대기 상태로 초기화했습니다.';renderTimer();}
function exportData(){const payload={version:1,exportedAt:new Date().toISOString(),posts:data.posts,categories:data.categories,todos:data.todos};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='DD-backup-'+today()+'.json';a.click();URL.revokeObjectURL(url);}
function importData(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.posts)||!Array.isArray(d.categories)||!d.todos||typeof d.todos!=='object')throw Error();const choice=confirm('기존 글과 투두가 모두 사라져요(메모와 카테고리 포함).\\n확인: 덮어쓰기\\n취소: 합치기 또는 취소 선택');if(choice){data.posts=d.posts;data.categories=d.categories;data.todos=d.todos;}else{const merge=confirm('백업 내용을 기존 데이터에 합칠까요?\\n확인: 합치기\\n취소: 불러오기 취소');if(!merge)return;const ids=new Set(data.posts.map(p=>p.id));d.posts.forEach(p=>{if(!ids.has(p.id))data.posts.push(p);});const catIds=new Set(data.categories.map(c=>c.id));d.categories.forEach(c=>{if(!catIds.has(c.id))data.categories.push(c);});Object.entries(d.todos).forEach(([day,arr])=>{data.todos[day]??=[];const existing=new Set(data.todos[day].map(x=>x.id));arr.forEach(x=>{if(!existing.has(x.id))data.todos[day].push(x);});});}save();currentId=null;renderCategorySelect();renderEntries();renderTodos();$('postTitle').value='';$('postBody').innerHTML='';$('noteList').innerHTML='';$('deletePost').disabled=true;toast('백업 데이터를 불러왔습니다.');}catch(e){alert('올바른 D.D 백업 JSON 파일이 아닙니다.');}};r.readAsText(file);}
$('newPost').onclick=newPost;$('deletePost').onclick=deletePost;$('addCategory').onclick=addCategory;$('search').oninput=renderEntries;
$('postTitle').oninput=saveCurrent;$('postBody').oninput=saveCurrent;$('postCategory').onchange=saveCurrent;
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>command(b.dataset.cmd,b.dataset.value));
for(let n=6;n<=24;n+=2)$('fontSize').insertAdjacentHTML('beforeend',`<option value="${n}">${n}px</option>`);

 // 선택 영역뿐 아니라 커서 위치의 다음 입력에도 글자 크기가 적용되도록 처리합니다.
 function applyFontSize(n){
  const editor=$('postBody'),sel=getSelection();
  if(!sel||!sel.rangeCount){editor.focus();return;}
  const range=sel.getRangeAt(0);
  editor.focus();
  if(!editor.contains(range.commonAncestorContainer)&&range.commonAncestorContainer!==editor)return;

  const span=document.createElement('span');
  span.style.fontSize=n+'px';
  if(range.collapsed){
   // 커서 위치에 입력용 스타일 영역을 만들고 커서를 그 안에 둡니다.
   span.appendChild(document.createTextNode('\\u200b'));
   range.insertNode(span);
   const caret=document.createRange();
   caret.setStart(span.firstChild,1);
   caret.collapse(true);
   sel.removeAllRanges();
   sel.addRange(caret);
  }else{
   const fragment=range.extractContents();
   span.appendChild(fragment);
   range.insertNode(span);
   const caret=document.createRange();
   caret.selectNodeContents(span);
   caret.collapse(false);
   sel.removeAllRanges();
   sel.addRange(caret);
  }
  saveCurrent();
 }
 $('fontSize').onchange=e=>{
  const n=Number(e.target.value);
  if(!n)return;
  applyFontSize(n);
  e.target.value='';
 };
 // 입력 후 커서용 보이지 않는 문자를 정리해 본문에 남지 않게 합니다.
 $('postBody').addEventListener('input',()=>{
  const editor=$('postBody');
  editor.querySelectorAll('span').forEach(span=>{
   if(span.textContent.includes('\\u200b'))span.textContent=span.textContent.replace(/\\u200b/g,'');
  });
  saveCurrent();
 });
$('noteForm').onsubmit=e=>{e.preventDefault();const p=currentPost(),v=$('noteInput').value.trim();if(!p){toast('먼저 글을 선택하거나 새 글을 작성하세요.');return;}if(!v)return;p.notes??=[];p.notes.push({id:uid(),text:v,createdAt:new Date().toISOString(),edited:false});$('noteInput').value='';save();renderNotes();renderEntries();};
$('timerStart').onclick=timerToggle;$('timerReset').onclick=timerReset;
$('todoDate').value=todoDay;$('todoDate').onchange=e=>{todoDay=e.target.value||today();renderTodos();};$('prevDay').onclick=()=>changeDay(-1);$('nextDay').onclick=()=>changeDay(1);$('todayBtn').onclick=()=>{todoDay=today();$('todoDate').value=todoDay;renderTodos();};
$('todoForm').onsubmit=e=>{e.preventDefault();const v=$('todoInput').value.trim();if(!v)return;data.todos[todoDay]??=[];data.todos[todoDay].push({id:uid(),text:v,done:false});$('todoInput').value='';save();renderTodos();};
$('exportBtn').onclick=exportData;$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value='';};
load();renderCategorySelect();renderEntries();renderTodos();renderTimer();if(data.posts.length)selectPost(data.posts.sort(postSort)[0].id);
tick=setInterval(()=>{if(data.timer.running)renderTimer();},250);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&data.timer.running)renderTimer();});
})();
