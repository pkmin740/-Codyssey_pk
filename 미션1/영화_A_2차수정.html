<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화 티어리스트</title>
    <style>
        /* --- CSS: 디자인 및 레이아웃 --- */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #e50914;
            --tier-s: #ff4b2b;
            --tier-a: #ff8c00;
            --tier-b: #ffcc00;
            --tier-c: #4caf50;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        header {
            width: 100%; max-width: 1200px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px;
        }

        h1 { margin: 0; font-size: 1.5rem; color: var(--accent-color); }

        .add-btn {
            background-color: var(--accent-color);
            color: white; border: none; padding: 10px 20px;
            border-radius: 5px; cursor: pointer; font-weight: bold;
            transition: 0.2s;
        }

        .add-btn:hover { background-color: #f40612; }

        /* 메인 컨테이너 */
        .main-container {
            display: flex; width: 100%; max-width: 1200px; gap: 20px;
            align-items: flex-start;
        }

        /* 티어 구역 (왼쪽) */
        .tier-section { flex: 3; display: flex; flex-direction: column; gap: 12px; }

        .tier-row {
            display: flex; min-height: 140px;
            background-color: var(--card-bg);
            border-radius: 8px; border: 1px solid #333;
            overflow: hidden;
        }

        .tier-label {
            width: 100px; min-width: 100px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #000; text-align: center;
            padding: 10px; font-size: 1rem;
        }

        .tier-content {
            flex: 1; display: flex; flex-wrap: wrap; padding: 15px; gap: 15px;
            min-height: 110px; transition: background 0.2s;
        }

        /* 티어별 색상 */
        .s-tier { background-color: var(--tier-s); }
        .a-tier { background-color: var(--tier-a); }
        .b-tier { background-color: var(--tier-b); }
        .c-tier { background-color: var(--tier-c); }

        /* 사이드바 (오른쪽) */
        .sidebar {
            flex: 1; background-color: var(--card-bg);
            border-radius: 8px; padding: 20px; border: 1px solid #333;
            min-height: 600px;
        }

        .sidebar h3 { margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; }

        .unclassified-list {
            display: flex; flex-wrap: wrap; gap: 12px; min-height: 500px;
            align-content: flex-start;
        }

        /* 영화 카드 (버그 수정 핵심 부분) */
        .movie-card {
            width: 90px; /* 카드 너비 고정 */
            cursor: grab; position: relative;
            background: #000; border-radius: 6px; overflow: hidden;
            border: 1px solid #444; flex-shrink: 0; /* 크기 줄어듦 방지 */
        }

        .movie-card:active { cursor: grabbing; }

        .movie-card img {
            width: 100%; height: 130px; object-fit: cover;
            pointer-events: none; /* 드래그 시 이미지만 잡히는 현상 방지 */
            display: block;
        }

        /* 제목 오버플로우 수정 */
        .movie-card .title {
            font-size: 0.75rem; text-align: center; 
            padding: 6px 4px;
            width: 100%; /* 부모 너비에 맞춤 */
            box-sizing: border-box; /* 패딩 포함 너비 계산 */
            white-space: nowrap; /* 한 줄로 유지 */
            overflow: hidden; /* 넘치는 부분 숨김 */
            text-overflow: ellipsis; /* 넘치면 ... 표시 */
            pointer-events: none;
            color: #ccc;
        }

        /* 드래그 효과 */
        .drag-over { background-color: rgba(229, 9, 20, 0.1) !important; outline: 2px dashed var(--accent-color); }

        /* 팝업 모달 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }

        .modal {
            background: #222; padding: 30px; border-radius: 12px;
            width: 320px; display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal h2 { margin: 0; font-size: 1.2rem; }

        .modal input {
            padding: 12px; border-radius: 6px; border: 1px solid #444;
            background: #000; color: #fff; outline: none;
        }

        .modal input:focus { border-color: var(--accent-color); }

        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
        .cancel-btn { background: #444; color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>🎬 MY MOVIE TIER</h1>
        <button class="add-btn" onclick="openModal()">+ 영화 추가</button>
    </header>

    <div class="main-container">
        <!-- 티어 구역 -->
        <div class="tier-section">
            <div class="tier-row">
                <div class="tier-label s-tier">인생영화</div>
                <div class="tier-content" id="tier-s"></div>
            </div>
            <div class="tier-row">
                <div class="tier-label a-tier">추천</div>
                <div class="tier-content" id="tier-a"></div>
            </div>
            <div class="tier-row">
                <div class="tier-label b-tier">볼만함</div>
                <div class="tier-content" id="tier-b"></div>
            </div>
            <div class="tier-row">
                <div class="tier-label c-tier">비추천</div>
                <div class="tier-content" id="tier-c"></div>
            </div>
        </div>

        <!-- 분류 전 목록 (사이드바) -->
        <div class="sidebar">
            <h3>분류 전 목록</h3>
            <div class="unclassified-list" id="unclassified"></div>
        </div>
    </div>

    <!-- 추가 팝업 모달 -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2>새 영화 추가</h2>
            <input type="text" id="movieTitle" placeholder="영화 제목을 입력하세요">
            <input type="text" id="movieUrl" placeholder="포스터 이미지 URL">
            <div class="modal-btns">
                <button class="cancel-btn" onclick="closeModal()">취소</button>
                <button class="add-btn" onclick="addMovie()">추가하기</button>
            </div>
        </div>
    </div>

    <script>
        /* --- JavaScript: 데이터 관리 및 드래그 앤 드롭 --- */

        let movies = JSON.parse(localStorage.getItem('movieTierData')) || [];

        // 1. 초기 로드
        window.onload = () => {
            renderMovies();
            initDragAndDrop();
        };

        // 2. 모달 제어
        function openModal() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { 
            document.getElementById('modal').style.display = 'none';
            document.getElementById('movieTitle').value = '';
            document.getElementById('movieUrl').value = '';
        }

        // 3. 영화 데이터 추가
        function addMovie() {
            const title = document.getElementById('movieTitle').value.trim();
            const url = document.getElementById('movieUrl').value.trim() || 'https://via.placeholder.com/90x130?text=No+Image';
            
            if(!title) {
                alert('영화 제목을 입력해주세요!');
                return;
            }

            const newMovie = {
                id: 'movie-' + Date.now(),
                title: title,
                url: url,
                tier: 'unclassified'
            };

            movies.push(newMovie);
            saveAndRefresh();
            closeModal();
        }

        // 4. 화면 렌더링
        function renderMovies() {
            const containers = ['tier-s', 'tier-a', 'tier-b', 'tier-c', 'unclassified'];
            containers.forEach(id => document.getElementById(id).innerHTML = '');

            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.draggable = true;
                card.id = movie.id;
                card.innerHTML = `
                    <img src="${movie.url}" alt="${movie.title}">
                    <div class="title">${movie.title}</div>
                `;
                
                // 드래그 시작 시 데이터 전달
                card.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', movie.id);
                    card.style.opacity = '0.4';
                });

                card.addEventListener('dragend', () => {
                    card.style.opacity = '1';
                });

                document.getElementById(movie.tier).appendChild(card);
            });
        }

        // 5. 드래그 앤 드롭 이벤트 바인딩
        function initDragAndDrop() {
            const dropZones = document.querySelectorAll('.tier-content, .unclassified-list');
            
            dropZones.forEach(zone => {
                zone.addEventListener('dragover', (e) => {
                    e.preventDefault(); // 드롭 허용
                    zone.classList.add('drag-over');
                });

                zone.addEventListener('dragleave', () => {
                    zone.classList.remove('drag-over');
                });

                zone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    zone.classList.remove('drag-over');
                    
                    const movieId = e.dataTransfer.getData('text/plain');
                    const targetTierId = zone.id;

                    // 데이터 상의 티어 정보 업데이트
                    movies = movies.map(m => {
                        if(m.id === movieId) return { ...m, tier: targetTierId };
                        return m;
                    });

                    saveAndRefresh();
                });
            });
        }

        // 6. 데이터 저장 및 화면 갱신
        function saveAndRefresh() {
            localStorage.setItem('movieTierData', JSON.stringify(movies));
            renderMovies();
        }
    </script>
</body>
</html>
